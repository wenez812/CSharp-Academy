<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>C# Academy</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>
<style>
:root{color-scheme:dark;--bg:#11151b;--panel:#191f28;--panel2:#202936;--border:#2d3948;--text:#e6edf5;--muted:#9ba9ba;--blue:#6ca8ff;--green:#6bd6a5;--red:#ff8e8e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 Inter,system-ui,-apple-system,sans-serif}button,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--border);background:var(--panel2);color:var(--text);padding:9px 12px;border-radius:9px}button:hover{border-color:var(--blue)}button.primary{background:#254b77;border-color:#356da9}button.success{background:#1e4c3c;border-color:#2c7658}.top{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);background:#141a22;position:sticky;top:0;z-index:4}.brand{font-weight:750;letter-spacing:.2px;font-size:16px}.brand span{color:var(--blue)}.status{font-size:12px;color:var(--muted)}.layout{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:calc(100vh - 58px)}aside{padding:16px 12px;border-right:1px solid var(--border);background:#141a22}.label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px;margin:8px 8px}.progressbox{padding:12px;background:var(--panel);border:1px solid var(--border);border-radius:12px;margin-bottom:16px}.bar{height:6px;background:#2c3542;border-radius:8px;overflow:hidden;margin:8px 0}.bar>div{height:100%;width:0;background:var(--green);transition:width .2s}.lesson-list{display:flex;flex-direction:column;gap:5px}.lesson{display:flex;gap:9px;text-align:left;width:100%;background:transparent;border-color:transparent;padding:9px 8px;color:var(--muted);align-items:flex-start}.lesson.active{background:#202c3a;border-color:#30465d;color:var(--text)}.lesson .num{width:23px;height:23px;flex-shrink:0;border-radius:6px;display:grid;place-items:center;background:#27313d;font-size:11px}.lesson.done .num{background:#20533f;color:#b7ffda}.lesson small{display:block;color:#8796a8;font-size:11px}.main{padding:20px;min-width:0;max-width:1500px;width:100%;margin:0 auto}.crumb{color:var(--muted);font-size:12px;margin-bottom:6px}.heading{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.heading h1{font-size:24px;line-height:1.25;margin:0 0 8px}.pill{font-size:11px;padding:4px 8px;border-radius:20px;border:1px solid var(--border);color:var(--blue);white-space:nowrap}.intro{color:#bdc8d6;max-width:850px}.card{background:var(--panel);border:1px solid var(--border);border-radius:13px;padding:15px;margin:14px 0}.card h2{font-size:15px;margin:0 0 8px}.example{background:#10151c;border:1px solid #273342;border-radius:10px;overflow:hidden}.examplehead{display:flex;justify-content:space-between;padding:8px 12px;color:var(--muted);font-size:12px;border-bottom:1px solid #273342}.codepre{margin:0;padding:13px;white-space:pre-wrap;font:12px/1.6 ui-monospace,SFMono-Regular,monospace;color:#c8e1ff}.practice{display:grid;grid-template-columns:1fr 1fr;gap:12px}.task{padding:12px;border:1px solid var(--border);border-radius:10px;background:#171e27}.task b{color:var(--green);font-size:12px}.task p{margin:6px 0 0}.editorbox{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#10151c}.editorbar{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:#1b232e;border-bottom:1px solid var(--border);gap:8px}.editorbar .left{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}.editorbar button{padding:7px 12px}.editorwrap{height:310px}#editor{height:100%;width:100%}.terminalhead{display:flex;justify-content:space-between;padding:8px 12px;border-top:1px solid var(--border);color:var(--muted);font-size:11px}.terminal{height:110px;overflow:auto;padding:10px 12px;background:#0c1117;color:#b9d9c8;white-space:pre-wrap;font:12px/1.5 ui-monospace,monospace}.terminal.error{color:var(--red)}.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.hint{color:#c3cedb}.footer{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:18px 0}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);padding:10px 15px;background:#26384b;border:1px solid #43617e;border-radius:10px;display:none;z-index:10;max-width:90vw}.loading{color:var(--muted);padding:30px;text-align:center}.mobiletoggle{display:none}
@media(max-width:760px){.layout{grid-template-columns:1fr}aside{display:none;border-right:0;border-bottom:1px solid var(--border)}aside.open{display:block}.mobiletoggle{display:inline-block}.main{padding:14px}.heading h1{font-size:21px}.practice{grid-template-columns:1fr}.editorwrap{height:280px}.top{padding:12px}.status{display:none}}
</style></head>
<body>
<header class="top"><div class="brand">⌘ <span>C#</span> Academy</div><div class="status" id="topStatus">Загрузка курса…</div><button class="mobiletoggle" onclick="toggleLessons()">Уроки ☰</button></header>
<div class="layout"><aside id="sidebar"><div class="progressbox"><div style="display:flex;justify-content:space-between;gap:8px"><b>Твой прогресс</b><span id="progressCount">0/28</span></div><div class="bar"><div id="progressBar"></div></div><small style="color:var(--muted)">Лучше заниматься понемногу каждый день.</small></div><div class="label">Учебная программа</div><div id="lessonList" class="lesson-list"></div></aside>
<main class="main"><div id="content" class="loading">Загружаю уроки…</div></main></div><div id="toast" class="toast"></div>
<script>
const tg=window.Telegram?.WebApp; if(tg){tg.ready();tg.expand();}
const initData=tg?.initData||'';let lessons=[],progress={items:{},completed:0,total:28},current=1,editor=null;
const headers={'Content-Type':'application/json','X-Telegram-Init-Data':initData};
async function api(path,opts={}){let r=await fetch(path,{...opts,headers:{...headers,...opts.headers}});let d=await r.json().catch(()=>({detail:'Не удалось прочитать ответ сервера'}));if(!r.ok)throw new Error(d.detail||'Ошибка запроса');return d}
function toast(s){let el=document.getElementById('toast');el.textContent=s;el.style.display='block';setTimeout(()=>el.style.display='none',2600)}
function toggleLessons(){document.getElementById('sidebar').classList.toggle('open')}
function renderList(){let list=document.getElementById('lessonList');list.innerHTML='';let lastStage=0;lessons.forEach(l=>{if(l.stage!==lastStage){let label=document.createElement('div');label.className='label';label.style.marginTop='16px';label.textContent='Этап '+l.stage+' · '+l.stage_name;list.appendChild(label);lastStage=l.stage;}let b=document.createElement('button');b.className='lesson'+(l.id===current?' active':'')+(progress.items[String(l.id)]?.completed?' done':'');b.innerHTML=`<span class="num">${progress.items[String(l.id)]?.completed?'✓':l.id}</span><span>${esc(l.title)}<small>Урок ${l.id}</small></span>`;b.onclick=()=>selectLesson(l.id);list.appendChild(b)});document.getElementById('progressCount').textContent=`${progress.completed||0}/${progress.total||lessons.length}`;document.getElementById('progressBar').style.width=((progress.completed||0)/(progress.total||lessons.length)*100)+'%';document.getElementById('topStatus').textContent=`${progress.completed||0} из ${lessons.length} уроков пройдено`}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function selectLesson(id){current=id;renderList();renderLesson();document.getElementById('sidebar').classList.remove('open')}
function renderLesson(){const l=lessons.find(x=>x.id===current);if(!l)return;const done=!!progress.items[String(l.id)]?.completed;document.getElementById('content').innerHTML=`<div class="crumb">Этап ${l.stage} / ${esc(l.stage_name)} · Урок ${l.id} из ${lessons.length}</div><div class="heading"><div><h1>${esc(l.title)}</h1><div class="intro">${esc(l.explanation)}</div></div><span class="pill">${done?'✓ Пройден':'Практика'}</span></div><section class="card"><h2>Пример кода</h2><div class="example"><div class="examplehead"><span>Program.cs</span><button onclick="loadExample()">В редактор</button></div><pre class="codepre">${esc(l.example_code)}</pre></div></section><section class="card"><h2>Практика</h2><div class="practice">${(l.practice_tasks||[l.task]).slice(0,2).map((t,i)=>`<div class="task"><b>ЗАДАНИЕ ${i+1}</b><p>${esc(t)}</p></div>`).join('')}</div><p class="hint"><b>Подсказка:</b> ${esc(l.hint||'Разбей задачу на маленькие шаги.')}</p></section><section class="card"><h2>Редактор C#</h2><div class="editorbox"><div class="editorbar"><div class="left"><span>●</span><span>Program.cs</span><span>· C#</span></div><div style="display:flex;gap:6px"><button onclick="loadExample()">Сбросить</button><button class="primary" onclick="runCode()">▶ Запустить</button></div></div><div class="editorwrap"><div id="editor"></div></div><div class="terminalhead"><span>ТЕРМИНАЛ / ВЫВОД</span><button onclick="clearOutput()" style="padding:2px 7px">Очистить</button></div><div id="terminal" class="terminal">Готов к запуску. Нажми «Запустить», чтобы выполнить код.</div></div><div class="controls"><button class="success" onclick="markComplete()">✓ Отметить урок пройденным</button><button onclick="previousLesson()">← Предыдущий</button><button onclick="nextLesson()">Следующий →</button></div><small style="display:block;color:var(--muted);margin-top:10px">Запуск кода требует доступа к внешнему сервису. Не вставляй пароли, токены или личные данные.</small></section><div class="footer"><span style="color:var(--muted)">Прогресс сохраняется в базе данных курса.</span><button onclick="showReview()">Повторить сложные темы</button></div>`;
if(editor){editor.dispose();editor=null;}if(window.require){require.config({paths:{vs:'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs'}});require(['vs/editor/editor.main'],()=>{editor=monaco.editor.create(document.getElementById('editor'),{value:l.example_code,language:'csharp',theme:'vs-dark',automaticLayout:true,minimap:{enabled:false},fontSize:13,lineNumbers:'on',scrollBeyondLastLine:false,wordWrap:'on',padding:{top:10},renderLineHighlight:'gutter'});});}else{document.getElementById('editor').innerHTML='<textarea id="fallback" style="width:100%;height:100%;background:#10151c;color:#dce8f7;border:0;padding:12px;font:13px monospace">'+esc(l.example_code)+'</textarea>';}}
function loadExample(){let l=lessons.find(x=>x.id===current);if(editor)editor.setValue(l.example_code);else{let e=document.getElementById('fallback');if(e)e.value=l.example_code;}toast('Пример восстановлен')}
function getCode(){return editor?editor.getValue():(document.getElementById('fallback')?.value||'')}
function clearOutput(){let t=document.getElementById('terminal');t.textContent='';t.classList.remove('error')}
async function runCode(){let t=document.getElementById('terminal');t.classList.remove('error');t.textContent='Запускаю код…';try{let d=await api('/api/run',{method:'POST',body:JSON.stringify({lesson_id:current,code:getCode(),stdin:''})});t.textContent=d.output||'Код выполнен без вывода.';if(d.stderr||d.compile_error)t.classList.add('error');}catch(e){t.textContent=e.message;t.classList.add('error')}}
async function markComplete(){try{await api('/api/complete',{method:'POST',body:JSON.stringify({lesson_id:current,score:100})});progress=await api('/api/progress');renderList();renderLesson();toast('Прогресс сохранён!');}catch(e){toast(e.message)}}
function previousLesson(){if(current>1)selectLesson(current-1)}function nextLesson(){if(current<lessons.length)selectLesson(current+1)}
async function showReview(){try{let d=await api('/api/review');if(!d.items.length){toast('Пока нечего повторять — пройди первый урок.');return}let l=d.items[0];toast('Для повторения: '+l.title);selectLesson(l.lesson_id)}catch(e){toast(e.message)}}
(async()=>{try{lessons=await api('/api/curriculum');progress=await api('/api/progress');renderList();renderLesson()}catch(e){document.getElementById('content').innerHTML='<div class="card"><h2>Не удалось загрузить курс</h2><p>'+esc(e.message)+'</p><p>Если ты открыл страницу отдельно, открой её через кнопку в Telegram-боте. Для локальной разработки можно включить DEV_MODE=true.</p></div>';}})();
</script></body></html>
